<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08090c">
<title>GlassPlayer</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://code.iconify.design/iconify-icon/3.0.4/iconify-icon.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/simple-liquid-glass/web-component"></script>

<style>
:root {
  color-scheme: dark;
  --bg: #08090c;
  --fg: #f7f7fa;
  --muted: rgba(255,255,255,.58);
  --glass-bg: rgba(35,37,43,.34);
  --glass-border: rgba(255,255,255,.19);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--bg);
  color: var(--fg);
  font-family: Inter, -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

button, input { font: inherit; }
button { color: inherit; border: 0; cursor: pointer; }

#app, #stage {
  position: fixed;
  inset: 0;
  overflow: hidden;
}

#app { background: #08090c; }

#stage {
  isolation: isolate;
  background:
    radial-gradient(ellipse at 50% 45%, #22252e 0%, #11131a 48%, #08090c 100%);
}

#ambient {
  position: absolute;
  inset: -12%;
  z-index: 0;
  background:
    radial-gradient(ellipse at 50% 50%, rgba(90,100,125,.22), transparent 58%),
    linear-gradient(145deg, #171a22, #08090c 75%);
  filter: blur(55px);
  transform: scale(1.1);
  transition: background 1s ease;
}

#video {
  position: absolute;
  z-index: 1;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: transparent;
  outline: none;
}

#shade {
  position: absolute;
  z-index: 2;
  inset: 0;
  pointer-events: none;
  background:
    linear-gradient(180deg, rgba(0,0,0,.45), transparent 27%),
    linear-gradient(0deg, rgba(0,0,0,.58), transparent 38%);
  opacity: 0;
  transition: opacity .3s ease;
}

#app.controls-visible #shade { opacity: 1; }

#empty {
  position: absolute;
  z-index: 3;
  inset: 0;
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: opacity .3s ease, visibility .3s ease;
}

.empty-content {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 15px;
  pointer-events: none;
  text-shadow: 0 2px 22px rgba(0,0,0,.5);
}

.empty-icon {
  width: 68px;
  height: 68px;
  display: grid;
  place-items: center;
  border-radius: 23px;
  background: rgba(255,255,255,.085);
  border: 1px solid rgba(255,255,255,.12);
  box-shadow: 0 12px 45px rgba(0,0,0,.2), inset 0 1px rgba(255,255,255,.12);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}

.empty-icon iconify-icon { width: 27px; height: 27px; font-size: 27px; }

.empty-label {
  font-size: 13px;
  font-weight: 500;
  color: rgba(255,255,255,.65);
}

#app.has-media #empty {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

/* Top bar */

#top {
  position: absolute;
  z-index: 10;
  top: calc(22px + var(--safe-top));
  left: 26px;
  right: 26px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  pointer-events: none;
  opacity: 0;
  transform: translateY(-5px);
  transition: opacity .22s ease, transform .22s ease;
}

#app.controls-visible #top {
  opacity: 1;
  transform: translateY(0);
}

#title {
  max-width: min(65vw, 700px);
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  font-size: 17px;
  line-height: 1.35;
  font-weight: 600;
  letter-spacing: -.035em;
  color: white;
  text-shadow: 0 2px 14px rgba(0,0,0,.8), 0 1px 3px rgba(0,0,0,.65);
  pointer-events: none;
}

#top-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  pointer-events: auto;
}

.top-button {
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  border-radius: 15px;
  color: white;
  background: rgba(30,32,38,.34);
  border: 1px solid rgba(255,255,255,.17);
  box-shadow: 0 5px 20px rgba(0,0,0,.16), inset 0 1px rgba(255,255,255,.12);
  backdrop-filter: blur(22px) saturate(1.5);
  -webkit-backdrop-filter: blur(22px) saturate(1.5);
  transition: background .15s ease, transform .15s ease;
}

.top-button:hover { background: rgba(255,255,255,.15); }
.top-button:active { transform: scale(.92); }
.top-button iconify-icon { width: 19px; height: 19px; font-size: 19px; }

#live-badge {
  display: none;
  align-items: center;
  gap: 7px;
  margin-top: 3px;
  margin-left: 12px;
  padding: 6px 10px;
  border-radius: 20px;
  background: rgba(0,0,0,.38);
  border: 1px solid rgba(255,255,255,.15);
  backdrop-filter: blur(14px);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .09em;
}

#live-badge.active { display: inline-flex; }

.live-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #ff4545;
  box-shadow: 0 0 10px #ff4545;
}

/* Center play */

#center-play {
  position: absolute;
  z-index: 5;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%) scale(.94);
  width: 76px;
  height: 76px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: rgba(25,27,32,.38);
  border: 1px solid rgba(255,255,255,.2);
  backdrop-filter: blur(22px) saturate(1.5);
  -webkit-backdrop-filter: blur(22px) saturate(1.5);
  box-shadow: 0 10px 45px rgba(0,0,0,.2), inset 0 1px rgba(255,255,255,.2);
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s ease, transform .2s ease;
}

#center-play iconify-icon { width: 27px; height: 27px; font-size: 27px; }

#app.paused.has-media #center-play {
  opacity: 1;
  pointer-events: auto;
  transform: translate(-50%, -50%) scale(1);
}

#app.controls-hidden #center-play { opacity: 0; }

/* Bottom controls */

#bottom {
  position: absolute;
  z-index: 8;
  left: 24px;
  right: 24px;
  bottom: calc(22px + var(--safe-bottom));
  display: flex;
  flex-direction: column;
  gap: 13px;
  opacity: 0;
  transform: translateY(9px);
  transition: opacity .25s ease, transform .25s ease;
  pointer-events: none;
}

#app.controls-visible #bottom {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

#timeline-wrap {
  width: 100%;
  padding: 9px 2px;
  cursor: pointer;
  touch-action: pan-y;
}

#timeline {
  position: relative;
  height: 4px;
  width: 100%;
  border-radius: 10px;
  background: rgba(255,255,255,.27);
  box-shadow: 0 1px 5px rgba(0,0,0,.2);
  transition: height .15s ease;
}

#timeline-wrap:hover #timeline,
#timeline-wrap:active #timeline { height: 6px; }

#buffered, #progress {
  position: absolute;
  left: 0;
  top: 0;
  height: 100%;
  width: 0;
  border-radius: inherit;
  pointer-events: none;
}

#buffered { background: rgba(255,255,255,.28); }
#progress { background: #fff; }

#scrubber {
  position: absolute;
  top: 50%;
  left: 0;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: white;
  transform: translate(-50%, -50%) scale(0);
  box-shadow: 0 1px 7px rgba(0,0,0,.35);
  transition: transform .15s ease;
}

#timeline-wrap:hover #scrubber,
#timeline-wrap:active #scrubber { transform: translate(-50%, -50%) scale(1); }

#toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.toolbar-side {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

#left-controls { flex: 1; }
#right-controls { justify-content: flex-end; flex: 1; }

.glass {
  display: flex;
  align-items: center;
  min-height: 54px;
  border-radius: 19px;
  overflow: visible;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  box-shadow:
    0 10px 35px rgba(0,0,0,.22),
    inset 0 1px 0 rgba(255,255,255,.19),
    inset 0 -1px 0 rgba(0,0,0,.12);
  backdrop-filter: blur(24px) saturate(1.7);
  -webkit-backdrop-filter: blur(24px) saturate(1.7);
}

liquid-glass.glass {
  display: flex;
  min-height: 54px;
  background: transparent;
  border: 0;
  box-shadow: none;
}

.control-group {
  display: flex;
  align-items: center;
  gap: 3px;
  padding: 5px 7px;
}

.control-btn {
  position: relative;
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  border-radius: 13px;
  color: rgba(255,255,255,.95);
  background: transparent;
  transition: background .15s ease, transform .15s ease;
}

.control-btn:hover { background: rgba(255,255,255,.12); }
.control-btn:active { transform: scale(.91); }
.control-btn iconify-icon { width: 20px; height: 20px; font-size: 20px; }

.control-btn.primary {
  width: 46px;
  height: 46px;
  border-radius: 15px;
}

.control-btn.primary iconify-icon { width: 23px; height: 23px; font-size: 23px; }

#volume-control {
  display: flex;
  align-items: center;
  gap: 0;
  padding: 0 7px 0 2px;
  border-radius: 13px;
}

#volume-slider {
  appearance: none;
  -webkit-appearance: none;
  width: 0;
  height: 4px;
  margin: 0;
  opacity: 0;
  cursor: pointer;
  border-radius: 20px;
  outline: none;
  background: rgba(255,255,255,.28);
  transition: width .2s ease, opacity .16s ease, margin .2s ease;
}

#volume-control:hover #volume-slider,
#volume-control:focus-within #volume-slider {
  width: 76px;
  margin-left: 5px;
  opacity: 1;
}

#volume-slider::-webkit-slider-thumb {
  appearance: none;
  -webkit-appearance: none;
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: #fff;
  border: 0;
  box-shadow: 0 1px 5px rgba(0,0,0,.35);
}

#volume-slider::-moz-range-thumb {
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: #fff;
  border: 0;
  box-shadow: 0 1px 5px rgba(0,0,0,.35);
}

#time-display {
  padding: 0 11px;
  white-space: nowrap;
  color: rgba(255,255,255,.82);
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}

/* Floating menus */

.floating-menu {
  position: absolute;
  right: 0;
  bottom: 68px;
  width: 250px;
  max-height: min(340px, 55vh);
  overflow-y: auto;
  padding: 9px;
  display: none;
  flex-direction: column;
  border-radius: 20px;
  background: rgba(30,31,36,.78);
  border: 1px solid rgba(255,255,255,.19);
  box-shadow: 0 18px 55px rgba(0,0,0,.38), inset 0 1px rgba(255,255,255,.14);
  backdrop-filter: blur(32px) saturate(1.6);
  -webkit-backdrop-filter: blur(32px) saturate(1.6);
  transform-origin: bottom right;
  animation: menu-in .16s ease;
}

.floating-menu.open { display: flex; }

@keyframes menu-in {
  from { opacity: 0; transform: translateY(5px) scale(.97); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.menu-heading {
  padding: 10px 11px 7px;
  color: rgba(255,255,255,.48);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
}

.menu-item, .caption-option {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  min-height: 42px;
  padding: 0 11px;
  border-radius: 12px;
  background: transparent;
  color: rgba(255,255,255,.92);
  text-align: left;
  font-size: 12px;
  font-weight: 500;
}

.menu-item:hover, .caption-option:hover { background: rgba(255,255,255,.1); }
.menu-value { color: rgba(255,255,255,.53); font-size: 11px; }

.caption-option.selected, .quality-option.selected {
  color: white;
  background: rgba(255,255,255,.12);
}

.caption-check, .quality-check { opacity: 0; color: rgba(255,255,255,.95); }
.caption-check iconify-icon, .quality-check iconify-icon { font-size: 15px; vertical-align: middle; }
.caption-kind { color: rgba(255,255,255,.42); font-size: 10px; margin-left: 9px; }

.caption-option.selected .caption-check,
.quality-option.selected .quality-check { opacity: 1; }

#settings-menu { right: 0; }
#caption-menu { right: 0; }
#quality-menu { right: 0; }

.quality-option {
  display: flex;
  justify-content: space-between;
  align-items: center;
  min-height: 42px;
  padding: 0 11px;
  border-radius: 12px;
  background: transparent;
  color: rgba(255,255,255,.9);
  font-size: 12px;
  text-align: left;
}

.quality-option:hover { background: rgba(255,255,255,.1); }

/* Info panel */

#info-panel {
  position: absolute;
  z-index: 12;
  top: calc(74px + var(--safe-top));
  right: 26px;
  width: min(310px, calc(100vw - 36px));
  padding: 17px;
  border-radius: 21px;
  background: rgba(27,29,35,.78);
  border: 1px solid rgba(255,255,255,.18);
  box-shadow: 0 18px 55px rgba(0,0,0,.38), inset 0 1px rgba(255,255,255,.13);
  backdrop-filter: blur(32px) saturate(1.6);
  -webkit-backdrop-filter: blur(32px) saturate(1.6);
  display: none;
  animation: menu-in .16s ease;
}

#info-panel.open { display: block; }

.info-title {
  font-size: 14px;
  font-weight: 650;
  margin-bottom: 14px;
}

.info-row {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  padding: 9px 0;
  border-top: 1px solid rgba(255,255,255,.09);
  font-size: 11px;
}

.info-label { color: rgba(255,255,255,.48); }
.info-value {
  max-width: 65%;
  text-align: right;
  color: rgba(255,255,255,.9);
  overflow-wrap: anywhere;
}

/* Error overlay */

#error-overlay {
  position: absolute;
  inset: 0;
  z-index: 100;
  display: none;
  place-items: center;
  background: rgba(8, 9, 12, .92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}

#error-overlay.open { display: grid; }

.error-panel {
  width: min(400px, calc(100vw - 48px));
  padding: 32px 28px;
  text-align: center;
  border-radius: 24px;
  background: rgba(28, 30, 36, .95);
  border: 1px solid rgba(255, 255, 255, .15);
  box-shadow: 0 24px 80px rgba(0, 0, 0, .5);
}

.error-icon { margin-bottom: 16px; color: #ff6b6b; }
.error-icon iconify-icon { width: 48px; height: 48px; font-size: 48px; }

.error-panel h2 { margin: 0 0 12px; font-size: 20px; font-weight: 650; }

.error-panel p {
  margin: 0 0 16px;
  color: rgba(255, 255, 255, .7);
  font-size: 14px;
  line-height: 1.5;
}

.error-details {
  margin-bottom: 24px;
  padding: 12px;
  border-radius: 12px;
  background: rgba(0, 0, 0, .3);
  color: rgba(255, 255, 255, .5);
  font-size: 11px;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  text-align: left;
  overflow-wrap: anywhere;
  max-height: 100px;
  overflow-y: auto;
  white-space: pre-wrap;
}

.error-button {
  padding: 12px 24px;
  border-radius: 14px;
  background: rgba(255, 255, 255, .15);
  color: white;
  font-weight: 600;
  font-size: 14px;
  transition: background .15s ease;
}

.error-button:hover { background: rgba(255, 255, 255, .25); }

/* Misc */

#toast {
  position: absolute;
  z-index: 20;
  left: 50%;
  bottom: calc(112px + var(--safe-bottom));
  transform: translate(-50%, 8px);
  padding: 10px 15px;
  border-radius: 14px;
  color: white;
  background: rgba(24,25,30,.76);
  border: 1px solid rgba(255,255,255,.14);
  backdrop-filter: blur(20px);
  font-size: 12px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s ease, transform .2s ease;
  white-space: nowrap;
}

#toast.show { opacity: 1; transform: translate(-50%, 0); }

#loading {
  position: absolute;
  z-index: 4;
  left: 50%;
  top: 50%;
  width: 34px;
  height: 34px;
  margin: -17px 0 0 -17px;
  border: 2px solid rgba(255,255,255,.2);
  border-top-color: white;
  border-radius: 50%;
  animation: spin .8s linear infinite;
  opacity: 0;
  pointer-events: none;
}

#loading.active { opacity: .9; }

@keyframes spin { to { transform: rotate(360deg); } }

video::cue {
  color: white;
  background: rgba(0,0,0,.55);
  font-family: Inter, sans-serif;
  font-size: 1em;
  text-shadow: 0 1px 3px rgba(0,0,0,.8);
}

#file-input { display: none; }

@media (max-width: 650px) {
  #top {
    top: calc(14px + var(--safe-top));
    left: 15px;
    right: 15px;
  }

  #title { font-size: 15px; }
  .top-button { width: 39px; height: 39px; border-radius: 14px; }

  #bottom {
    left: 10px;
    right: 10px;
    bottom: calc(12px + var(--safe-bottom));
    gap: 8px;
  }

  #toolbar { gap: 5px; }
  .glass, liquid-glass.glass { min-height: 48px; border-radius: 17px; }
  .control-group { padding: 3px 4px; gap: 0; }
  .control-btn { width: 36px; height: 39px; }
  .control-btn.primary { width: 41px; height: 42px; }
  #volume-control { padding-right: 4px; }
  #volume-control:hover #volume-slider,
  #volume-control:focus-within #volume-slider { width: 55px; }
  #time-display { font-size: 10px; padding: 0 5px; }
  .floating-menu { bottom: 61px; }
  #info-panel { top: calc(62px + var(--safe-top)); right: 15px; }
}

@media (max-width: 390px) {
  #time-display { display: none; }
  .control-btn { width: 33px; }
  #volume-control:hover #volume-slider,
  #volume-control:focus-within #volume-slider { width: 43px; }
}
</style>
</head>

<body>
<div id="app" class="controls-visible">
  <main id="stage">
    <div id="ambient"></div>
    <video id="video" playsinline preload="metadata"></video>
    <div id="shade"></div>

    <div id="empty" aria-label="Open a video">
      <div class="empty-content">
        <div class="empty-icon"><iconify-icon icon="ph:play-fill"></iconify-icon></div>
        <div class="empty-label">Open a video</div>
      </div>
    </div>

    <div id="top">
      <div style="display:flex;align-items:flex-start">
        <div id="title"></div>
        <div id="live-badge"><span class="live-dot"></span> LIVE</div>
      </div>

      <div id="top-actions">
        <button class="top-button" id="pip-btn" aria-label="Picture in Picture" title="Picture in Picture">
          <iconify-icon icon="ph:picture-in-picture"></iconify-icon>
        </button>
        <button class="top-button" id="info-btn" aria-label="Player information" title="Player information">
          <iconify-icon icon="ph:info"></iconify-icon>
        </button>
      </div>
    </div>

    <section id="info-panel">
      <div class="info-title">Player Information</div>
      <div class="info-row"><span class="info-label">Name</span><span class="info-value" id="info-name">—</span></div>
      <div class="info-row"><span class="info-label">Type</span><span class="info-value" id="info-type">—</span></div>
      <div class="info-row"><span class="info-label">MIME type</span><span class="info-value" id="info-mime">—</span></div>
      <div class="info-row"><span class="info-label">Player</span><span class="info-value">GlassPlayer</span></div>
      <div class="info-row"><span class="info-label">Playback</span><span class="info-value" id="info-playback">—</span></div>
      <div class="info-row"><span class="info-label">Resolution</span><span class="info-value" id="info-resolution">—</span></div>
    </section>

    <div id="loading"></div>

    <button id="center-play" aria-label="Play or pause">
      <iconify-icon icon="ph:play-fill"></iconify-icon>
    </button>

    <div id="bottom">
      <div id="timeline-wrap">
        <div id="timeline">
          <div id="buffered"></div>
          <div id="progress"></div>
          <div id="scrubber"></div>
        </div>
      </div>

      <div id="toolbar">
        <div class="toolbar-side" id="left-controls">
          <liquid-glass class="glass" backdrop-selector="#stage" strength="0.13" radius="19" blur="13" saturation="1.55">
            <div class="control-group">
              <button class="control-btn primary" id="play-btn" aria-label="Play">
                <iconify-icon icon="ph:play-fill"></iconify-icon>
              </button>

              <button class="control-btn" id="back-btn" aria-label="Back 10 seconds">
                <iconify-icon icon="ph:arrow-counter-clockwise"></iconify-icon>
              </button>

              <button class="control-btn" id="forward-btn" aria-label="Forward 10 seconds">
                <iconify-icon icon="ph:arrow-clockwise"></iconify-icon>
